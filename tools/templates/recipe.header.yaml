# NOTE: tools/templates/server.cfg deliberately deviates from the old vendored KoraFiveM recipe copy (a0b64c7):
# it has NO active `ensure` lines in its startup sections. tools/generate.py appends one `ensure [folder]` per
# folder that holds a generated resource, plus [addons] and [streamedassets] (folders only, never single resources).
$engine: 3
$onesync: 'on'
name: Kora Framework
version: 0.2.0-alpha
author: KoraFiveM
description: Official txAdmin recipe for Kora Framework Alpha.
tasks:
# @inline server.cfg ./server.cfg
# @inline permissions.cfg ./permissions.cfg
- action: connect_database
# @inline kora.sql ./kora.sql
- action: replace_string
  file: ./kora.sql
  search: KORA_DATABASE_NAME
  replace: '{{dbName}}'
- action: replace_string
  mode: all_vars
  file:
  - ./kora.sql
- action: query_database
  file: ./kora.sql
